name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (java-kotlin, manual build)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write   # 解析結果のアップロード
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ランナーイメージに Ant が無い場合だけインストールする
      - name: Ensure Ant
        run: |
          if ! command -v ant >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q ant
          fi
          ant -version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          # より多くのルールで検査したい場合
          # queries: security-extended

      # init と analyze の間で実行された javac が解析対象になる（クリーンビルド必須）
      - name: Build (Ant x N via shell script)
        run: bash build_all.sh

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin

      # SBOM はアーティファクトとして保存するだけにする。
      # 依存関係は pom.xml から GitHub が直接認識するため、依存グラフへの登録（dependency-snapshot）はしない。
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          syft-version: v1.52.0
          artifact-name: sbom.spdx.json
          dependency-snapshot: false
