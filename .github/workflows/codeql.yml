name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (java-kotlin, manual build)
    # build_all.bat をそのまま動かすため Windows ランナーを使う
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      security-events: write   # 解析結果のアップロード
      contents: write          # Dependency submission API（SBOM を依存グラフへ登録）
      actions: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ランナーイメージに Ant が無い場合だけインストールする
      - name: Ensure Ant
        shell: pwsh
        run: |
          if (-not (Get-Command ant -ErrorAction SilentlyContinue)) {
            $v = '1.10.15'
            Invoke-WebRequest "https://archive.apache.org/dist/ant/binaries/apache-ant-$v-bin.zip" -OutFile ant.zip
            Expand-Archive ant.zip -DestinationPath $env:RUNNER_TEMP
            "ANT_HOME=$env:RUNNER_TEMP\apache-ant-$v" | Out-File $env:GITHUB_ENV -Append
            "$env:RUNNER_TEMP\apache-ant-$v\bin" | Out-File $env:GITHUB_PATH -Append
          }

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          # より多くのルールで検査したい場合
          # queries: security-extended

      # init と analyze の間で実行された javac が解析対象になる（クリーンビルド必須）
      - name: Build (Ant x N via batch)
        shell: cmd
        run: call build_all.bat

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin

      # lib/ の jar と war を Syft で解析して SBOM を生成し、依存グラフに登録する
      # （Ant はマニフェストが無く GitHub が依存を認識できないため。登録分は Dependabot alerts の対象になる）
      - name: Generate SBOM and submit dependency snapshot
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          syft-version: v1.52.0
          artifact-name: sbom.spdx.json
          dependency-snapshot: true
